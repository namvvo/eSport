  countApp: Int! = 0
  direction: SortDirection! = DESC
  fixtureId: Int! = 0
  minPlayed: Int! = 0
  onlyRegisteredPlayers: Boolean! = true
  orderBy: LeaguePlayerOrderBy! = GOALS
  pageIndex: Int! = 0
  pageSize: Int! = 50
  playerIds: [Int!] = []
  playerName: String = ""
  priceOrder: Int! = 0
  seasonStageIds: Int! = 0
  teamId: Int! = 0
  teamPosition: String = ""
  timeFrom: DateTime
  timeLimit: DateTime
  timeTo: DateTime
}

"The scope of a cache hint."
enum CacheControlScope {
  "The value to cache is not tied to a single user."
  PUBLIC
  "The value to cache is specific to a single user."
  PRIVATE
}

enum FixtureStatusEnum {
  NOT_STARTED
  POSTPONED
  CANCELED
  FINISHED
  AET
}

enum LeaguePlayerOrderBy {
  RATING
  GOALS
  DEFENSE
  OFFENSE
  PASSING
  MARKET_VALUE
  APPS
  ASSISTS
  MINUTES
  SAVES
}

enum ScalarSerializationType {
  STRING
  BOOLEAN
  INT
  FLOAT
  OBJECT
  LIST
}

enum SortDirection {
  ASC
  DESC
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal

directive @cacheControl(
  inheritMaxAge: Boolean
  maxAge: Int
  scope: CacheControlScope
  sharedMaxAge: Int
  vary: [String]
) on OBJECT | FIELD_DEFINITION | INTERFACE | UNION

directive @cost(weight: String!) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION